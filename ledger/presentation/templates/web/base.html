<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LedgerSystem{% endblock %} · LedgerSystem</title>
  <style>
    :root {
      --bg: #f6f7f9; --surface: #fff; --text: #1d2330; --muted: #5f6b7a; --border: #dde1e7;
      --accent: #2f5bd3; --accent-text: #fff;
      --ok: #1f7a4d; --ok-bg: #e5f4ec; --warn: #8a5a00; --warn-bg: #fdf3dc;
      --err: #b42318; --err-bg: #fde8e6; --info-bg: #e8eefc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b; --surface: #1b2029; --text: #e6e9ef; --muted: #9aa4b2; --border: #2c3340;
        --accent: #6d8ff0; --accent-text: #0d1016;
        --ok: #6fd3a0; --ok-bg: #173226; --warn: #f2c46b; --warn-bg: #3a2e14;
        --err: #ff8a80; --err-bg: #3d1a18; --info-bg: #1d2744;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--text); }
    a { color: var(--accent); }
    header.top { background: var(--surface); border-bottom: 1px solid var(--border); }
    header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 12px; }
    header.top .brand { font-weight: 700; text-decoration: none; color: var(--text); margin-right: auto; }
    .wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; }
    main.wrap { padding-block: 24px 48px; }
    h1 { font-size: 1.5rem; margin: 0 0 16px; }
    h2 { font-size: 1.1rem; margin: 0 0 12px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
            padding: 20px; margin-bottom: 20px; }
    .muted { color: var(--muted); }
    .btn { display: inline-block; border: 1px solid var(--border); background: var(--surface);
           color: var(--text); padding: 8px 14px; border-radius: 8px; font: inherit;
           cursor: pointer; text-decoration: none; white-space: nowrap; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .btn.danger { color: var(--err); border-color: var(--err); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .link-btn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); font-weight: 600; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .table-scroll { overflow-x: auto; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8rem;
             font-weight: 600; white-space: nowrap; background: var(--info-bg); }
    .badge.APPROVED, .badge.ok { background: var(--ok-bg); color: var(--ok); }
    .badge.REJECTED, .badge.err { background: var(--err-bg); color: var(--err); }
    .badge.PENDING_APPROVAL, .badge.warn { background: var(--warn-bg); color: var(--warn); }
    tr.ERROR td { background: var(--err-bg); }
    tr.WARNING td { background: var(--warn-bg); }
    .messages { list-style: none; padding: 0; margin: 0 0 20px; }
    .messages li { padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; background: var(--info-bg); }
    .messages .success { background: var(--ok-bg); color: var(--ok); }
    .messages .warning { background: var(--warn-bg); color: var(--warn); }
    .messages .error { background: var(--err-bg); color: var(--err); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .filters a { text-decoration: none; }
    .filters a.active .badge { outline: 2px solid var(--accent); }
    form p { margin: 0 0 14px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input[type=text], input[type=password], textarea, input[type=file] {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text); font: inherit; }
    textarea { min-height: 80px; }
    .errorlist { color: var(--err); margin: 4px 0 0; padding-left: 18px; }
    .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
    dl.kv dt { color: var(--muted); }
    dl.kv dd { margin: 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
    .meter { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; width: 80px; display: inline-block; vertical-align: middle; margin-right: 6px; }
    .meter span { display: block; height: 100%; background: var(--accent); }
    code { font-size: .9em; }
    .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .tabs a { padding: 8px 14px; text-decoration: none; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tabs a.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
    .filters-form { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .filters-form p { margin: 0; }
    .filters-form input[type=date], .filters-form select, .filters-form input[type=text] {
      padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
    .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 20px; }
    .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .tile .label { color: var(--muted); font-size: .85rem; }
    .tile .value { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .tile .hint { color: var(--muted); font-size: .8rem; }
    .chart-box { position: relative; height: 280px; }
    details > summary { cursor: pointer; color: var(--accent); margin-top: 8px; }
    .pos { color: var(--ok); } .neg { color: var(--err); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="{% url 'web:batch-list' %}">LedgerSystem</a>
      {% if user.is_authenticated %}
        <a href="{% url 'web:batch-list' %}">Lotes</a>
        <a href="{% url 'web:analytics' %}">Analítica</a>
        <a class="btn primary" href="{% url 'web:batch-upload' %}">Subir CSV</a>
        <span class="muted">{{ user.get_username }}</span>
        <form method="post" action="{% url 'web:logout' %}">
          {% csrf_token %}<button class="link-btn" type="submit">Salir</button>
        </form>
      {% endif %}
    </div>
  </header>
  <main class="wrap">
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
