x-app-env: &app-env
  DJANGO_ENV: ${DJANGO_ENV:-development}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  POSTGRES_DB: ${POSTGRES_DB:-ledger}
  POSTGRES_USER: ${POSTGRES_USER:-ledger}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledger}
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: runtime
    environment: *app-env
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment: *app-env
    command: ["pytest"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
